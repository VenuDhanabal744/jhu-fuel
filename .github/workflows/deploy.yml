# Publishes the app to GitHub Pages with fresh JHU dining menus.
# Runs every morning (and whenever you push), so the menus are always current.
name: Update menus & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *' # 5:17 AM Eastern (during daylight time)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/hf-models
          key: clip-vit-base-patch32-q8
      - name: Download JHU menus
        run: node scripts/build-menus.mjs
      - name: Precompute dish-name embeddings
        run: node scripts/build-embeddings.mjs
        env:
          HF_CACHE_DIR: /home/runner/.cache/hf-models
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
      # GitHub pauses scheduled jobs in repos with no activity for 60 days; this keeps it on.
      - name: Keep the daily schedule enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
